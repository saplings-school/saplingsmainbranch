<body class="bg-slate-100 text-slate-800 font-sans antialiased min-h-screen">

<script>
// ===================== SETTINGS =====================
const FIREBASE_CONFIG = {
    apiKey: "AIzaSyAXhTB5FmH5l29PrXszO03xEt4dEEW_GLQ",
    authDomain: "saplings-91d93.firebaseapp.com",
    projectId: "saplings-91d93",
    storageBucket: "saplings-91d93.firebasestorage.app",
    messagingSenderId: "918074017839",
    appId: "1:918074017839:web:7897a77337619e9df61eda",
    // Realtime Database address. If the Firebase console shows a different address
    // (for example ...asia-southeast1.firebasedatabase.app), paste it here.
    databaseURL: "https://saplings-91d93-default-rtdb.firebaseio.com"
};
const FB = FIREBASE_CONFIG.databaseURL.replace(/\/$/, '');
const DAYS = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const DEFAULT_AVATAR = "data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='100' height='100' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23d1fae5'/%3E%3Ccircle cx='50' cy='38' r='18' fill='%2310b981'/%3E%3Cpath d='M18 90c0-18 14-30 32-30s32 12 32 30z' fill='%2310b981'/%3E%3C/svg%3E";

// ===================== HELPERS =====================
function esc(v) {
    return String(v == null ? '' : v).replace(/[&<>"']/g, function(c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
}
function $(id) { return document.getElementById(id); }
function mkey(sub) { return String(sub).replace(/[.$#\[\]\/\\]/g, '_'); }
function toList(x) {
    if (Array.isArray(x)) return x.filter(function(v) { return v !== null && v !== undefined; });
    if (x && typeof x === 'object') return Object.keys(x).map(function(k) { return x[k]; });
    return [];
}
function keepHoles(x) {
    if (Array.isArray(x)) return x;
    if (x && typeof x === 'object') { const a = []; Object.keys(x).forEach(function(k) { a[Number(k)] = x[k]; }); return a; }
    return [];
}
function isoOf(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function isoToday() { return isoOf(new Date()); }
function isoTomorrow() { const d = new Date(); d.setDate(d.getDate() + 1); return isoOf(d); }
function todayDay() { const d = new Date().getDay(); return d === 0 ? 'Mon' : (DAYS[d - 1] || 'Mon'); }

// ===================== SECURE LOGIN + CLOUD =====================
// The teacher signs in with Firebase Authentication (Teacher ID + PIN). The PIN is checked by Google, never stored
// in the database and never compared in this page. The database rules let a teacher read only their own record,
// the shared school data, and write only small records under their own inbox ("inbox/<teacher id>/...").
// The admin page checks every inbox record before it becomes real data.
const AUTH_KEY = FIREBASE_CONFIG.apiKey;
const AUTH_ROLE = 'teacher';
let AUTH = null;      // { idToken, refreshToken, expiresAt, uid }
let CUR_TID = '';     // the signed-in teacher's id (used for the inbox path)
function idKey(id) { return String(id).trim().toLowerCase().replace(/[^a-z0-9._-]/g, '_'); }
function loginEmail(id) { return idKey(id) + '@' + AUTH_ROLE + '.saira.invalid'; }
function pinPassword(pin) { return 'PIN' + String(pin).trim(); }
function saveSession(id) { try { localStorage.setItem('saira_teacher_login', JSON.stringify({ id: id, rt: AUTH.refreshToken, uid: AUTH.uid })); } catch (e) { /* storage blocked */ } }
async function authSignIn(id, pin) {
    const res = await fetch('https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=' + AUTH_KEY, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: loginEmail(id), password: pinPassword(pin), returnSecureToken: true })
    });
    const j = await res.json();
    if (!res.ok) { const m = (j.error && j.error.message) || ''; const e = new Error(m); e.code = m; throw e; }
    AUTH = { idToken: j.idToken, refreshToken: j.refreshToken, expiresAt: Date.now() + Number(j.expiresIn || 3600) * 1000, uid: j.localId };
}
async function authRefresh(rt) {
    const res = await fetch('https://securetoken.googleapis.com/v1/token?key=' + AUTH_KEY, {
        method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: 'grant_type=refresh_token&refresh_token=' + encodeURIComponent(rt)
    });
    const j = await res.json();
    if (!res.ok) throw new Error('SESSION_EXPIRED');
    AUTH = { idToken: j.id_token, refreshToken: j.refresh_token, expiresAt: Date.now() + Number(j.expires_in || 3600) * 1000, uid: j.user_id };
}
async function authToken() {
    if (!AUTH) throw new Error('NOAUTH');
    if (Date.now() > AUTH.expiresAt - 90000) { await authRefresh(AUTH.refreshToken); if (CUR_TID) saveSession(CUR_TID); }
    return AUTH.idToken;
}
function authErrorText(e) {
    const c = String((e && (e.code || e.message)) || '');
    if (/EMAIL_NOT_FOUND|INVALID_PASSWORD|INVALID_LOGIN_CREDENTIALS|USER_DISABLED/.test(c)) return 'Wrong Teacher ID or PIN. Please check and try again.';
    if (/TOO_MANY_ATTEMPTS/.test(c)) return 'Too many attempts. Please wait a few minutes and try again.';
    if (/NOROLE/.test(c)) return 'This account is not active yet. Please ask the school office.';
    if (/NOVIEW/.test(c)) return 'Your information has not been published yet. Please ask the school office.';
    return 'Could not connect. Please check your internet and try again.';
}
// Old paths "saira_inbox/<type>/<id>" now live under this teacher's own inbox node.
function urlOf(path) {
    let p = path;
    if (CUR_TID) { if (p === 'saira_inbox') p = 'inbox/' + CUR_TID; else p = p.replace(/^saira_inbox\//, 'inbox/' + CUR_TID + '/'); }
    return FB + '/' + p.split('/').map(encodeURIComponent).join('/') + '.json';
}

// ---- Offline cache: the last data received is kept on this device and shown when there is no internet ----
const CACHE_PFX = 'saplings_cache_';
let OFFLINE = false;
function isNetErr(e) { return e instanceof TypeError || navigator.onLine === false; }
function cacheSet(key, data) { try { localStorage.setItem(CACHE_PFX + key, JSON.stringify(data)); } catch (e) { /* storage full */ } }
function cacheGet(key) { try { const v = localStorage.getItem(CACHE_PFX + key); return v === null ? undefined : JSON.parse(v); } catch (e) { return undefined; } }
function cacheClear() { try { Object.keys(localStorage).filter(function(k) { return k.indexOf(CACHE_PFX) === 0; }).forEach(function(k) { localStorage.removeItem(k); }); } catch (e) { /* ignore */ } }
function offlineNote() { const el = $('load-status'); if (el) el.innerText = OFFLINE ? 'Offline: showing the last saved information.' : ''; }
async function fbGet(path) {
    const ck = urlOf(path);
    try {
        const res = await fetch(ck + '?auth=' + encodeURIComponent(await authToken()));
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        cacheSet(ck, data);
        return data;
    } catch (e) {
        if (isNetErr(e)) { const c = cacheGet(ck); if (c !== undefined) { OFFLINE = true; return c; } }
        throw e;
    }
}
async function fbGetPublic(path) {
    const res = await fetch(urlOf(path));
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return res.json();
}
// The teacher never changes the school's main data. Every action is written as a small record into the
// teacher's own inbox; the admin page checks it and merges it into the main data.
// ---- Offline outbox: if there is no internet, the record is kept on this device and sent automatically later ----
function outboxKey() { return 'saplings_outbox_' + CUR_TID; }
function outboxGet() { try { return JSON.parse(localStorage.getItem(outboxKey())) || []; } catch (e) { return []; } }
function outboxSet(q) { try { if (q.length) localStorage.setItem(outboxKey(), JSON.stringify(q)); else localStorage.removeItem(outboxKey()); return true; } catch (e) { return false; } }
function outboxBadge() {
    let b = document.getElementById('outbox-badge');
    const n = CUR_TID ? outboxGet().length : 0;
    if (!n) { if (b) b.remove(); return; }
    if (!b) { b = document.createElement('div'); b.id = 'outbox-badge'; b.style.cssText = 'position:fixed;left:8px;bottom:8px;z-index:9999;background:#f59e0b;color:#fff;font-size:11px;font-weight:600;padding:5px 10px;border-radius:999px;box-shadow:0 1px 4px rgba(0,0,0,.3)'; document.body.appendChild(b); }
    b.innerText = n + ' record(s) waiting to sync';
}
async function fbSend(method, path, value) {
    const opt = { method: method };
    if (method === 'PUT') { opt.headers = { 'Content-Type': 'application/json' }; opt.body = JSON.stringify(value); }
    const res = await fetch(urlOf(path) + '?auth=' + encodeURIComponent(await authToken()), opt);
    if (!res.ok) { const e = new Error('HTTP ' + res.status); e.http = res.status; throw e; }
}
let outboxFlushing = false;
async function flushOutbox() {
    if (outboxFlushing || !CUR_TID || !AUTH) return;
    outboxFlushing = true;
    try {
        let q = outboxGet();
        while (q.length) {
            const it = q[0];
            try { await fbSend(it.m, it.p, it.v); }
            catch (e) { if (isNetErr(e) || e.http >= 500 || e.http === 401 || /NOAUTH/.test(String(e.message))) break; /* rejected for good: drop it */ }
            q.shift(); outboxSet(q);
        }
    } finally { outboxFlushing = false; outboxBadge(); }
}
async function fbWrite(method, path, value) {
    const item = { m: method, p: path, v: value === undefined ? null : value };
    if (outboxGet().length) { const q = outboxGet(); q.push(item); if (outboxSet(q)) { outboxBadge(); flushOutbox(); return; } }
    try { await fbSend(method, path, value); }
    catch (e) {
        if (isNetErr(e)) { const q = outboxGet(); q.push(item); if (outboxSet(q)) { outboxBadge(); return; } }
        throw e;
    }
}
async function fbPut(path, value) { return fbWrite('PUT', path, value); }
async function fbDel(path) { return fbWrite('DELETE', path); }
window.addEventListener('online', function() { flushOutbox(); });
setInterval(flushOutbox, 30000);

// ===================== STATE =====================
let S = null;
let qr = null, lastScan = { id: '', at: 0 };

function teacherPairs(t) {
    const a = toList(t.assignments);
    if (a.length) return a;
    if (t.subject || t.assignedClass) return [{ cls: t.assignedClass || '', subject: t.subject || '' }];
    return [];
}

let VIEW = null;   // this teacher's published record (teacherView/<id>)
async function loadTeacher(id) {
    OFFLINE = false;
    const role = await fbGet('roles/' + AUTH.uid);
    if (!role || role.role !== 'teacher' || role.id !== id) throw new Error('NOROLE');
    VIEW = await fbGet('teacherView/' + id);
    if (!VIEW || !VIEW.t) throw new Error('NOVIEW');
    return VIEW.t;
}

async function loadAll(t) {
    const br = t.branchId || 'main', tid = t.id, today = isoToday();
    const pairs = teacherPairs(t);
    const classes = [];
    pairs.forEach(function(p) { if (p.cls && classes.indexOf(p.cls) === -1) classes.push(p.cls); });
    const safe = function(p, fallback) { return p.catch(function() { return fallback; }); };

    // one personal record + shared school data + this teacher's own pending inbox
    const net = await Promise.all([
        safe(fbGet('pub'), {}),
        safe(fbGet('staff'), {}),
        safe(fbGet('saira_inbox'), null)
    ]);
    const pub = net[0] || {}, staff = net[1] || {}, view = VIEW || {};
    const pubSettings = Object.assign({}, pub.settings || {});
    if (view.aiKey) pubSettings.geminiApiKey = view.aiKey;   // only shared when the admin ticks "share key"; readable by this teacher only
    const attList = (view.attDate === today) ? toList(view.att) : [];
    const roster = view.roster || {};
    const r = [
        pubSettings, toList(pub.branches), toList(pub.examTests), toList(pub.subjects), toList(pub.periodTimes), staff.timetables || {},
        toList(view.homeworks), attList, toList(staff.messages), net[2],
        classes.map(function(c) { return toList(roster[mkey(c)]); }),
        staff.syllabus || {}, toList(view.tasks)
    ];
    const settings = r[0] || {}, branches = toList(r[1]), tests = toList(r[2]), subjects = toList(r[3]);
    const inbox = r[9] || {};

    // students of my classes (this branch)
    const students = {};
    classes.forEach(function(c, i) {
        students[c] = r[10][i].filter(function(s) { return (s.branchId || 'main') === br; }).sort(function(a, b) { return String(a.name).localeCompare(String(b.name)); });
    });

    // homework: mine, including records the admin has not merged yet, minus deleted ones
    const hw = {};
    r[6].forEach(function(h) { if (h && h.id) hw[h.id] = h; });
    Object.keys(inbox.homeworks || {}).forEach(function(id) { if (inbox.homeworks[id] && inbox.homeworks[id].teacherId === tid) hw[id] = inbox.homeworks[id]; });
    Object.keys(inbox.homeworkDel || {}).forEach(function(id) { delete hw[id]; });
    const homework = Object.keys(hw).map(function(k) { return hw[k]; }).sort(function(a, b) { return String(b.id).localeCompare(String(a.id)); });

    // today's attendance of my students
    const mine = {};
    classes.forEach(function(c) { students[c].forEach(function(s) { mine[s.id] = true; }); });
    const att = {};
    r[7].forEach(function(a) { if (a && mine[a.id]) att[a.id] = a; });
    Object.keys(inbox.attendance || {}).forEach(function(k) {
        const a = inbox.attendance[k];
        if (a && a.date === today && mine[a.id]) { if (a.status === 'Absent') delete att[a.id]; else att[a.id] = a; }
    });

    // messages
    const mm = {};
    toList(r[8]).forEach(function(m) { if (m && m.id) mm[m.id] = m; });
    Object.keys(inbox.messages || {}).forEach(function(id) { mm[id] = inbox.messages[id]; });
    Object.keys(inbox.messageDel || {}).forEach(function(id) { delete mm[id]; });
    const messages = Object.keys(mm).map(function(k) { return mm[k]; }).sort(function(a, b) { return String(b.id).localeCompare(String(a.id)); });

    // marks of every test (+ records the admin has not merged yet)
    const marks = {};
    const mr = tests.map(function(tt) { return ((VIEW && VIEW.marks) || {})[tt.id] || {}; });
    tests.forEach(function(tt, i) { marks[tt.id] = JSON.parse(JSON.stringify(mr[i] || {})); });
    Object.keys(inbox.marks || {}).forEach(function(k) {
        const m = inbox.marks[k];
        if (!m || !marks[m.testId]) return;
        if (m.v === '' || m.v == null) { if (marks[m.testId][m.sid]) delete marks[m.testId][m.sid][m.key]; }
        else { if (!marks[m.testId][m.sid]) marks[m.testId][m.sid] = {}; marks[m.testId][m.sid][m.key] = Number(m.v); }
    });

    // syllabus (+ pending chapter completions in saira_inbox not yet merged by Admin)
    const syllabus = JSON.parse(JSON.stringify(r[11] || {}));
    Object.keys(inbox.syllabusComplete || {}).forEach(function(k) {
        const sc = inbox.syllabusComplete[k];
        if (sc && sc.sylKey && syllabus[sc.sylKey] && Array.isArray(syllabus[sc.sylKey].chapters)) {
            const ch = syllabus[sc.sylKey].chapters.find(function(c) { return String(c.id) === String(sc.chapterId) || Number(c.no) === Number(sc.chapterNo); });
            if (ch) {
                ch.status = sc.status || 'Completed';
                ch.completedAt = sc.completedAt || '';
                ch.completedBy = sc.completedBy || '';
            }
        }
    });

    // teacherTasks assigned to me (+ pending status updates in saira_inbox)
    const myTasks = toList(r[12]).filter(function(tk) { return tk && tk.teacherId === tid; });
    Object.keys(inbox.taskStatus || {}).forEach(function(k) {
        const ts = inbox.taskStatus[k];
        if (ts && ts.taskId) {
            const tk = myTasks.find(function(x) { return x.id === ts.taskId; });
            if (tk) { tk.status = ts.status || 'Completed'; tk.completedAt = ts.completedAt || ''; }
        }
    });

    // Also check if I marked my own teacher attendance today
    let myAttToday = false;
    r[7].forEach(function(a) { if (a && a.id === tid) myAttToday = true; });
    Object.keys(inbox.attendance || {}).forEach(function(k) {
        const a = inbox.attendance[k];
        if (a && a.date === today && a.id === tid) myAttToday = (a.status !== 'Absent');
    });

    S = { t: t, br: br, pairs: pairs, classes: classes, settings: settings, branches: branches, tests: tests, subjects: subjects,
          periodTimes: toList(r[4]), timetables: r[5] || {}, students: students, homework: homework, att: att, messages: messages, marks: marks,
          syllabus: syllabus, tasks: myTasks, myAttToday: myAttToday, sylPairIdx: 0,
          tab: 'home', day: null, cls: classes[0] || '', cur: [], mk: { test: '', cls: '', sub: '' }, filter: '' };
}

// ===================== LOGIN =====================
function showLoginError(msg) { const e = $('login-error'); e.innerText = msg; e.classList.remove('hidden'); }

async function handleLogin(auto) {
    const id = $('login-id').value.trim().toUpperCase();
    const pin = $('login-pin').value.trim();
    $('login-error').classList.add('hidden');
    if (!id) return showLoginError('Please enter Teacher ID' + (auto ? '.' : ' and PIN.'));
    if (!auto && !pin) return showLoginError('Please enter Teacher ID and PIN.');
    const btn = $('login-btn'); btn.disabled = true;
    try {
        if (auto !== 'saved') await authSignIn(id, pin);
        CUR_TID = id;
        const t = await loadTeacher(id);
        saveSession(id);
        await openApp(t);
    } catch (e) {
        AUTH = null; CUR_TID = '';
        showLoginError(auto ? 'Please sign in again.' : authErrorText(e));
    }
    btn.disabled = false;
}
async function openApp(t) {
    await loadAll(t);
    $('login-screen').classList.add('hidden');
    $('main-app').classList.remove('hidden');
    $('hdr-school').innerText = S.settings.name || 'School';
    $('hdr-name').innerText = t.name + ' • ' + t.id;

    showTab('home');
    offlineNote();
    outboxBadge();
    flushOutbox();
}

async function refreshAll() {
    if (!S) return;
    $('load-status').innerText = 'Refreshing...';
    const keep = { tab: S.tab, cls: S.cls, mk: S.mk, day: S.day };
    try {
        const t = await loadTeacher(S.t.id);
        if (t) await loadAll(t);
        S.cls = S.classes.indexOf(keep.cls) >= 0 ? keep.cls : (S.classes[0] || '');
        S.mk = keep.mk; S.day = keep.day;
        showTab(keep.tab);
        offlineNote();
        flushOutbox();
    } catch (e) { $('load-status').innerText = 'Could not refresh. Check your internet.'; }
}

function logout() {
    if (CUR_TID && outboxGet().length && !confirm('Some records are still waiting to sync (no internet). If you log out they will be sent when you log in again with internet.\n\nLog out anyway?')) return;
    stopScan();
    localStorage.removeItem('saira_teacher_login');
    cacheClear();
    outboxBadge();
    AUTH = null; CUR_TID = ''; VIEW = null; S = null;
    outboxBadge();
    $('main-app').classList.add('hidden');
    $('login-screen').classList.remove('hidden');

}

function showTab(name) {
    if (S.tab === 'attendance' && name !== 'attendance') stopScan();
    S.tab = name;
    document.querySelectorAll('.tab').forEach(function(el) { el.classList.add('hidden'); });
    $('tab-' + name).classList.remove('hidden');
    document.querySelectorAll('.nav-btn').forEach(function(b) { b.classList.toggle('active', b.getAttribute('data-tab') === name); });
    ({ home: renderHome, timetable: renderTimetable, students: renderStudents, attendance: renderAttendance, marks: renderMarks, syllabus: renderSyllabus, homework: renderHomework, messages: renderMessages })[name]();

    const out = [];
    S.pairs.forEach(function(p) { if (p.cls === cls && p.subject && out.indexOf(p.subject) === -1) out.push(p.subject); });
    return out;

function saveFail() { alert('Could not save. Please check your internet and try again.\n\nمحفوظ نہیں ہو سکا۔ انٹرنیٹ چیک کریں۔'); }

// ---------- timetable data ----------
function cellOf(v) {
    if (v && typeof v === 'object') return { t: v.t || '', s: v.s || '', n: v.n || '' };
    if (typeof v === 'string' && v) return { t: '', s: v, n: '' };
    return { t: '', s: '', n: '' };
}
// my periods on a day: [{i, time, cls, subject}]
function myPeriods(day) {
    const out = [];
    Object.keys(S.timetables).forEach(function(key) {
        const sep = key.indexOf('|');
        if (key.slice(0, sep) !== S.br) return;
        const cls = key.slice(sep + 1), tt = S.timetables[key] || {};
        const arr = keepHoles((tt.days || {})[day]);
        for (let i = 0; i < (tt.periods || 8); i++) {
            const c = cellOf(arr[i]);
            if (!c.s) continue;
            const mine = c.t ? c.t === S.t.id : S.pairs.some(function(p) { return p.cls === cls && p.subject === c.s; });
            if (mine) out.push({ i: i, time: S.periodTimes[i] || '', cls: cls, subject: c.s });
        }
    });
    return out.sort(function(a, b) { return a.i - b.i; });
}

async function toggleAtt(i) {

async function markAll() {
    const todo = S.cur.filter(function(s) { return !S.att[s.id]; });
    if (!todo.length) return;
    try { await Promise.all(todo.map(function(s) { return setAttendance(s, 'Present'); })); } catch (e) { saveFail(); }

function startScan() {
    if (qr || typeof Html5Qrcode === 'undefined') { if (typeof Html5Qrcode === 'undefined') alert('QR scanner could not load. Use the Present / Absent buttons.'); return; }
    $('reader-wrap').classList.remove('hidden');
    qr = new Html5Qrcode('reader');
    qr.start({ facingMode: 'environment' }, { fps: 10, qrbox: { width: 240, height: 240 } }, onScan, function() {}).catch(function() {
        qr = null; $('reader-wrap').classList.add('hidden');
        alert('Camera could not start. Please allow camera permission.');
    });
}
function stopScan() {
    if (qr) { const q = qr; qr = null; q.stop().then(function() { q.clear(); }).catch(function() {}); }
    const w = $('reader-wrap'); if (w) w.classList.add('hidden');
}
function scanMsg(text, kind) {
    const el = $('scan-result');
    el.innerText = text;
    el.className = 'text-sm font-medium p-3 rounded-lg ' + (kind === 'ok' ? 'bg-emerald-50 text-emerald-700' : kind === 'warn' ? 'bg-amber-50 text-amber-700' : 'bg-rose-50 text-rose-700');
}
async function onScan(text) {
    let id = String(text).trim().toUpperCase();
    const m = String(text).match(/(SR-\d+)/i);
    if (m) id = m[1].toUpperCase();
    const now = Date.now();
    if (lastScan.id === id && now - lastScan.at < 3000) return;
    lastScan = { id: id, at: now };
    let st = null;
    S.classes.forEach(function(c) { S.students[c].forEach(function(s) { if (s.id === id) st = s; }); });
    if (!st) return scanMsg('This student is not in your classes.', 'bad');
    if (S.att[st.id]) return scanMsg('Already present: ' + st.name, 'warn');
    try { await setAttendance(st, 'Present'); } catch (e) { return scanMsg('Could not save. Check internet.', 'bad'); }
    scanMsg('Marked present: ' + st.name + ' (' + st.id + ')', 'ok');
    if (S.cls !== st.className) { S.cls = st.className; $('att-class').value = S.cls; }
    S.cur = S.students[S.cls] || [];
    renderAttList();
}

function openStudentMarks(i) {
    const st = S.cur[i], test = S.tests.find(function(t) { return t.id === S.mk.test; });
    if (!st || !test) return;
    const subs = subjectsOfClass(S.mk.cls);
    let m = document.getElementById('sm-modal');
    if (!m) { m = document.createElement('div'); m.id = 'sm-modal'; m.className = 'fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-3'; document.body.appendChild(m); }

    m.innerHTML = '<div class="bg-white rounded-2xl p-4 w-full max-w-sm max-h-[90vh] overflow-y-auto"><h3 class="font-bold text-sm mb-1">' + esc(st.name) + ' - ' + esc(test.name) + '</h3><p class="text-[11px] text-slate-500 mb-2">Sab subjects ke marks edit karein (out of ' + esc(test.max) + ')</p>' +
        subs.map(function(x, k) { const v = (S.marks[test.id][st.id] || {})[mkey(x)]; return '<div class="flex items-center gap-2 mb-2"><span class="flex-1 text-sm">' + esc(x) + '</span><input type="number" step="any" min="0" max="' + esc(test.max) + '" data-sub="' + esc(x) + '" value="' + (v === undefined ? '' : esc(v)) + '" class="sm-in w-24 px-2 py-2 border rounded-lg text-sm text-center"></div>'; }).join('') +
        '<div class="flex gap-2 mt-2"><button onclick="saveStudentMarks(' + i + ')" class="flex-1 bg-indigo-600 text-white py-2 rounded-lg font-semibold text-sm">Save All</button><button onclick="document.getElementById(\'sm-modal\').style.display=\'none\'" class="flex-1 bg-slate-200 py-2 rounded-lg text-sm">Cancel</button></div></div>';
}
async function saveStudentMarks(i) {
    const st = S.cur[i], test = S.tests.find(function(t) { return t.id === S.mk.test; });
    const ins = Array.prototype.slice.call(document.querySelectorAll('.sm-in'));
    for (const el of ins) { const n = el.value.trim(); if (n !== '' && (isNaN(Number(n)) || Number(n) < 0 || Number(n) > test.max)) { alert('Marks must be between 0 and ' + test.max + ' (' + el.dataset.sub + ').'); return; } }
    try {
        for (const el of ins) {
            const key = mkey(el.dataset.sub), raw = el.value.trim(), v = raw === '' ? '' : Math.round(Number(raw) * 100) / 100;
            const prev = (S.marks[test.id][st.id] || {})[key];
            if ((prev === undefined && v === '') || prev === v) continue;
            await fbPut('saira_inbox/marks/' + test.id + '__' + st.id + '__' + key, { testId: test.id, sid: st.id, key: key, v: v });
            if (!S.marks[test.id][st.id]) S.marks[test.id][st.id] = {};
            if (v === '') delete S.marks[test.id][st.id][key]; else S.marks[test.id][st.id][key] = v;
        }
    } catch (e) { return saveFail(); }
    document.getElementById('sm-modal').style.display = 'none';
    renderMarks();
}
async function saveMark(i, el) {
    const st = S.cur[i], mk = S.mk;
    const test = S.tests.find(function(t) { return t.id === mk.test; });
    if (!st || !test || !mk.sub) return;
    const key = mkey(mk.sub);
    const prev = (S.marks[test.id][st.id] || {})[key];
    const raw = String(el.value).trim();
    let v = '';
    if (raw !== '') {
        const n = Number(raw);
        if (isNaN(n) || n < 0 || n > test.max) { alert('Marks must be between 0 and ' + test.max + '.'); el.value = prev === undefined ? '' : prev; return; }
        v = Math.round(n * 100) / 100;
    }
    try {
        await fbPut('saira_inbox/marks/' + test.id + '__' + st.id + '__' + key, { testId: test.id, sid: st.id, key: key, v: v });
    } catch (e) { el.value = prev === undefined ? '' : prev; return saveFail(); }
    if (!S.marks[test.id][st.id]) S.marks[test.id][st.id] = {};
    if (v === '') delete S.marks[test.id][st.id][key]; else S.marks[test.id][st.id][key] = v;
    const s = $('mk-status'); if (s) s.innerText = 'Saved ✓ ' + st.name;
}

async function editHomework(i) {
    const h = S.homework[i];
    if (!h) return;
    const text = prompt('Homework details:', h.description);
    if (text === null) return;
    const due = prompt('Due date (YYYY-MM-DD):', h.dueDate);

    if (!text.trim() || !/^\d{4}-\d{2}-\d{2}$/.test(due.trim())) return alert('Please enter the details and a date like 2026-11-05.');

    try { await fbPut('saira_inbox/homeworks/' + h.id, upd); } catch (e) { return saveFail(); }
    S.homework[i] = upd;
    renderHomework();

async function deleteHomework(i) {

        await fbDel('saira_inbox/homeworks/' + h.id);

    S.homework.splice(i, 1);
    renderHomework();
}

async function completeChapterAndNotify(chapIdx) {
    const p = S.pairs[S.sylPairIdx];
    if (!p) return;
    const key = sylKeyOf(p.cls, p.subject);
    if (!S.syllabus[key]) S.syllabus[key] = { className: p.cls, subject: p.subject, bookName: '', publisher: '', chapters: [] };
    const entry = S.syllabus[key];
    const ch = entry.chapters[chapIdx];
    if (!ch) return;

    await triggerChapterCompletionFlow(p.cls, p.subject, entry.bookName || '', key, ch);
}

async function completeCustomTopic() {
    const p = S.pairs[S.sylPairIdx];
    if (!p) return;
    const inp = $('custom-chap-title');
    const title = (inp ? inp.value : '').trim();
    if (!title) return alert('Please write the chapter or topic name first.');
    const key = sylKeyOf(p.cls, p.subject);
    if (!S.syllabus[key]) S.syllabus[key] = { className: p.cls, subject: p.subject, bookName: '', publisher: '', chapters: [] };
    const entry = S.syllabus[key];
    if (!Array.isArray(entry.chapters)) entry.chapters = [];
    const newCh = {
        id: 'CH-' + Date.now(),
        no: entry.chapters.length + 1,
        title: title,
        month: 'Current Month',
        status: 'Completed',
        completedAt: new Date().toLocaleDateString(),
        completedBy: S.t.name
    };
    entry.chapters.push(newCh);
    if (inp) inp.value = '';
    await triggerChapterCompletionFlow(p.cls, p.subject, entry.bookName || '', key, newCh);
}

async function triggerChapterCompletionFlow(cls, subject, bookName, sylKey, ch) {
    const todayStr = new Date().toLocaleDateString();
    const nowStr = new Date().toLocaleString();
    ch.status = 'Completed';
    ch.completedAt = todayStr;
    ch.completedBy = S.t.name;

    // 1. Draft initial clean message (and upgrade via Gemini AI if Central Key is available)
    let draftMsg = buildDefaultWhatsappDraft(cls, subject, bookName, ch.title, S.t.name, S.settings.name);

    activeWaContext = {
        cls: cls,
        subject: subject,
        bookName: bookName,
        chapterTitle: ch.title,
        sylKey: sylKey,
        chapterId: ch.id || ('CH-' + ch.no)
    };

    // 2. Push to Firebase Inbox:
    //    (a) syllabusComplete -> updates Admin's Syllabus tracker
    //    (b) messages -> immediately shows up on Student Portal (Notices tab & Home count) AND Admin Notices
    //    (c) activityLog -> logs in Admin Portal's "Teacher Chapter Completions & Notification Log"
    const studentPortalNoticeText = '📚 Syllabus Update (' + subject + '): "' + ch.title + '" has been completed in class today by ' + S.t.name + '. Please revise this chapter at home!';
    const msgId = 'MSG-' + Date.now();
    const noticeRecord = {
        id: msgId,
        branchId: S.br,
        from: S.t.name + ' (' + subject + ')',
        fromId: S.t.id,
        toClass: cls,
        text: studentPortalNoticeText,
        date: nowStr,
        type: 'teacher'
    };
    const logId = 'LOG-' + Date.now();
    const activityRecord = {
        id: logId,
        branchId: S.br,
        teacherId: S.t.id,
        teacherName: S.t.name,
        className: cls,
        subject: subject,
        chapterTitle: ch.title,
        summary: 'Completed "' + ch.title + '" & notified ' + cls + ' students + parents',
        whatsappDraft: draftMsg,
        date: nowStr
    };

    try {
        await Promise.all([
            fbPut('saira_inbox/syllabusComplete/' + sylKey + '__' + (ch.id || ch.no), {
                sylKey: sylKey,
                chapterId: ch.id || ('CH-' + ch.no),
                chapterNo: ch.no || 1,
                status: 'Completed',
                completedAt: todayStr,
                completedBy: S.t.name
            }),
            fbPut('saira_inbox/messages/' + msgId, noticeRecord),
            fbPut('saira_inbox/activityLog/' + logId, activityRecord)
        ]);
        S.messages.unshift(noticeRecord);
    } catch (e) {
        return saveFail();
    }

    renderSyllabus();
    openWhatsappParentModal(cls, subject, ch.title, draftMsg, logId);
}

async function completeSelectedChapters() {
    const p = S.pairs[S.sylPairIdx];
    if (!p) return;
    const key = sylKeyOf(p.cls, p.subject);
    const entry = S.syllabus[key];
    if (!entry) return;
    const chs = toList(entry.chapters);
    const idxs = Object.keys(sylSelected).filter(function(k) { return sylSelected[k]; }).map(Number).sort(function(a, b) { return a - b; });
    const chapters = idxs.map(function(i) { return chs[i]; }).filter(function(c) { return c && c.status !== 'Completed'; });
    if (!chapters.length) return alert('Pehle kam az kam ek chapter tick karein.');
    const noteEl = $('multi-note');
    const note = noteEl ? noteEl.value.trim() : '';
    await triggerMultiChapterFlow(p.cls, p.subject, entry.bookName || '', key, chapters, note);
    sylSelected = {};
    renderSyllabus();
}

async function triggerMultiChapterFlow(cls, subject, bookName, sylKey, chapters, note) {
    const todayStr = new Date().toLocaleDateString();
    const nowStr = new Date().toLocaleString();
    chapters.forEach(function(ch) { ch.status = 'Completed'; ch.completedAt = todayStr; ch.completedBy = S.t.name; });
    const titles = chapters.map(function(c) { return c.title; });
    const titleList = titles.length === 1 ? titles[0] : titles.slice(0, -1).join(', ') + ' and ' + titles[titles.length - 1];

    let draftMsg = buildDefaultWhatsappDraft(cls, subject, bookName, titleList, S.t.name, S.settings.name);
    if (note) draftMsg = draftMsg.replace('Regards,', note + '\n\nRegards,');

    const noticeText = titles.length === 1
        ? '📚 Syllabus Update (' + subject + '): "' + titles[0] + '" has been completed in class today by ' + S.t.name + '. Please revise this chapter at home!' + (note ? '\n\nNote from teacher: ' + note : '')
        : '📚 Syllabus Update (' + subject + '): The following chapters have been completed in class by ' + S.t.name + ':\n' +
          titles.map(function(t, i) { return (i + 1) + '. ' + t; }).join('\n') +
          (note ? '\n\nNote from teacher: ' + note : '') + '\n\nPlease revise these chapters at home!';

    const msgId = 'MSG-' + Date.now();
    const logId = 'LOG-' + Date.now();
    const noticeRecord = { id: msgId, branchId: S.br, from: S.t.name + ' (' + subject + ')', fromId: S.t.id, toClass: cls, text: noticeText, date: nowStr, type: 'teacher' };
    const activityRecord = {
        id: logId, branchId: S.br, teacherId: S.t.id, teacherName: S.t.name, className: cls, subject: subject,
        chapterTitle: titleList, summary: 'Completed ' + chapters.length + ' chapter(s): ' + titleList + ' & notified ' + cls + ' students + parents',
        whatsappDraft: draftMsg, date: nowStr
    };
    activeWaContext = { cls: cls, subject: subject, bookName: bookName, chapterTitle: titleList, sylKey: sylKey,
        chapterId: chapters.map(function(c) { return c.id || ('CH-' + c.no); }).join(',') };

    try {
        const jobs = chapters.map(function(ch) {
            return fbPut('saira_inbox/syllabusComplete/' + sylKey + '__' + (ch.id || ch.no), {
                sylKey: sylKey, chapterId: ch.id || ('CH-' + ch.no), chapterNo: ch.no || 1,
                status: 'Completed', completedAt: todayStr, completedBy: S.t.name
            });
        });
        jobs.push(fbPut('saira_inbox/messages/' + msgId, noticeRecord));
        jobs.push(fbPut('saira_inbox/activityLog/' + logId, activityRecord));
        await Promise.all(jobs);
        S.messages.unshift(noticeRecord);
    } catch (e) {
        return saveFail();
    }
    openWhatsappParentModal(cls, subject, titleList, draftMsg, logId);
}

function formatWhatsAppPhone(rawPhone) {
    let digits = String(rawPhone || '').replace(/\D/g, '');
    if (!digits) return '';
    if (digits.startsWith('00')) digits = digits.slice(2);
    if (digits.startsWith('03') && digits.length === 11) {
        digits = '92' + digits.slice(1);
    } else if (digits.startsWith('0') && digits.length >= 10) {
        digits = '92' + digits.slice(1);
    }
    return digits;
}

function tryTeacherFastPath(qText) {
    const q = String(qText || '').toLowerCase().trim();
    if (!S) return null;
    if (q.includes('hazri') || q.includes('attendance') || q.includes('syllabus')) {
        let totalStu = 0, presStu = 0;
        S.classes.forEach(function(c) {
            (S.students[c] || []).forEach(function(st) {
                totalStu++;
                if (S.att[st.id]) presStu++;
            });
        });
        let sylLines = [];
        S.pairs.forEach(function(p) {
            const e = (S.syllabus || {})[sylKeyOf(p.cls, p.subject)];
            const chs = e && e.chapters ? e.chapters : [];
            const done = chs.filter(function(c) { return c.status === 'Completed'; }).length;
            sylLines.push('• ' + p.cls + ' (' + p.subject + '): ' + done + '/' + chs.length + ' chapters completed');
        });
        return '📊 Aaj ki Class Hazri & Syllabus Summary:\n• Present Students: ' + presStu + ' / ' + totalStu + '\n' + (sylLines.join('\n') || '• No syllabus chapters configured yet.');
    }
    if (q.includes('task') || q.includes('deadline')) {
        const pending = (S.tasks || []).filter(function(tk) { return tk.status !== 'Completed'; });
        if (!pending.length) return 'Alhamdulillah! Aapke ذمے Admin ka koi pending task nahi hai.';
        return '✅ Aapke Pending Admin Tasks (' + pending.length + '):\n' + pending.map(function(tk, i) {
            return (i + 1) + '. ' + tk.title + ' (Deadline: ' + tk.dueDate + ')';
        }).join('\n');
    }
    return null;
}

async function callTeacherGeminiAPI(userPrompt, skipContext) {
    const apiKey = getCentralGeminiKey();
    if (!apiKey) {
        throw new Error('AI abhi dastiyab nahi hai. Meharbani karke school office / admin se rabta karein.');
    }
    const teacherSnapshot = skipContext ? '' : JSON.stringify({
        school: S.settings.name,
        teacherName: S.t.name,
        teacherId: S.t.id,
        assignedClassesAndSubjects: S.pairs,
        pendingTasks: (S.tasks || []).filter(function(x) { return x.status !== 'Completed'; }),
        homeworkCount: S.homework.length
    });
    const sys = 'You are the helpful Teacher AI Assistant inside Saira School Teacher Portal. Reply concisely in Pakistani Roman Urdu or English without any ** asterisks.';
    const payload = {
        contents: [{ parts: [{ text: sys + (teacherSnapshot ? '\nCONTEXT: ' + teacherSnapshot : '') + '\nREQUEST: ' + userPrompt }] }]
    };

    // Fast model first, newer model as backup. Retries on busy/overloaded servers.
    const modelList = ['gemini-3.5-flash-lite', 'gemini-3.8-flash'];
    let res = null, lastErr = '';
    for (let i = 0; i < modelList.length; i++) {
        const endpoint = 'https://generativelanguage.googleapis.com/v1beta/models/' + modelList[i] + ':generateContent';
        const controller = new AbortController();
        const timer = setTimeout(function() { controller.abort(); }, 45000);
        try {
            res = await fetch(endpoint, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'X-goog-api-key': apiKey },
                body: JSON.stringify(payload),
                signal: controller.signal
            });
            clearTimeout(timer);
            if (res.ok) break;
            lastErr = '(' + res.status + ') ' + (await res.text());
            if ([429, 500, 502, 503, 504].indexOf(res.status) < 0 && res.status !== 404) break;
        } catch (err) {
            clearTimeout(timer);
            lastErr = (err && err.name === 'AbortError') ? 'Timeout' : (err && err.message) || 'Network error';
            res = null;
        }
        await new Promise(function(r) { setTimeout(r, 1000); });
    }
    if (!res || !res.ok) {
        if (/503|429|UNAVAILABLE|high demand/i.test(lastErr)) throw new Error('Google AI server abhi masroof hai. 1-2 minute baad dobara try karein.');
        if (lastErr === 'Timeout') throw new Error('Jawab nahi aaya (Timeout). Internet check karke dobara try karein.');
        throw new Error('AI Error ' + lastErr.slice(0, 160));
    }
    const data = await res.json();
    return cleanTeacherMarkdown(data?.candidates?.[0]?.content?.parts?.[0]?.text || '');
}

async function handleTeacherAiSubmit(e) {
    if (e) e.preventDefault();
    const inp = $('t-ai-input');
    const btn = $('t-ai-send-btn');
    const text = (inp ? inp.value : '').trim();
    if (!text) return;
    inp.value = '';
    appendTeacherAiBubble('user', text);

    const fast = tryTeacherFastPath(text);
    if (fast) {
        appendTeacherAiBubble('ai', fast);
        return;
    }

    const waitBubble = appendTeacherAiBubble('ai', '⏳ AI Assistant jawab tayar kar raha hai...');
    if (btn) btn.disabled = true;
    try {
        const reply = await callTeacherGeminiAPI(text, false);
        waitBubble.innerText = reply || 'Jawab masool nahi hua.';
    } catch (err) {
        waitBubble.innerText = '⚠️ ' + err.message;
    } finally {
        if (btn) btn.disabled = false;
    }
}

// ===== v2: Teacher AI Helper (Lesson plan, Weak students, Remarks draft). Added only; nothing old changed. =====
function tv2Card(title, btns) {
    return card('<p class="text-sm font-bold text-slate-800 mb-2">🧠 ' + esc(title) + '</p><div class="flex flex-wrap gap-2">' + btns + '</div><p id="tv2-st" class="text-[11px] text-slate-500 mt-2 min-h-[14px]"></p><textarea id="tv2-out" rows="9" class="hidden w-full mt-2 border rounded-lg p-2.5 text-sm bg-slate-50"></textarea><button type="button" id="tv2-cp" onclick="tv2Copy()" class="hidden mt-2 w-full bg-slate-700 text-white text-xs font-bold py-2 rounded-lg">Copy</button><p class="text-[10px] text-slate-400 mt-1">Suggestion only. Parh kar istemal karein.</p>');
}
function tv2Btn(label, fn) { return '<button type="button" onclick="' + fn + '" class="text-xs bg-sky-50 hover:bg-sky-100 text-sky-800 font-semibold px-3 py-2 rounded-lg border border-sky-200">' + label + '</button>'; }
function tv2Show(text) { const o = document.getElementById('tv2-out'); o.value = text; o.classList.remove('hidden'); document.getElementById('tv2-cp').classList.remove('hidden'); }
function tv2Copy() { const o = document.getElementById('tv2-out'); o.select(); try { navigator.clipboard.writeText(o.value); } catch (e) { document.execCommand('copy'); } document.getElementById('tv2-st').innerText = 'Copy ho gaya.'; }
async function tv2Ask(prompt) {
    const st = document.getElementById('tv2-st'); st.innerText = 'AI kaam kar raha hai...';
    try { const r = (await callTeacherGeminiAPI(prompt, true) || '').trim(); if (!r) throw new Error('AI ne khali jawab diya. Dobara try karein.'); tv2Show(r); st.innerText = 'Tayyar.'; }
    catch (e) { st.innerText = 'Error: ' + (e && e.message ? e.message : e); }
}
function tv2ClassRows(cls) {
    const subs = subjectsOfClass(cls), map = {}; subs.forEach(function(x) { map[mkey(x)] = x; });
    return (S.students[cls] || []).map(function(s) {
        const acc = {}; S.tests.forEach(function(t) { const m = (S.marks[t.id] || {})[s.id] || {}, mx = Number(t.max) || 100; Object.keys(m).forEach(function(k) { const v = Number(m[k]); if (!isNaN(v)) (acc[map[k] || k] = acc[map[k] || k] || []).push(v * 100 / mx); }); });
        const avg = {}; Object.keys(acc).forEach(function(k) { avg[k] = Math.round(acc[k].reduce(function(a, b) { return a + b; }, 0) / acc[k].length); });
        return { name: s.name, avgPctBySubject: avg };
    }).filter(function(r) { return Object.keys(r.avgPctBySubject).length; });
}
function tv2Lesson() {
    const p = S.pairs[S.sylPairIdx] || S.pairs[0]; if (!p) return;
    const e = (S.syllabus || {})[sylKeyOf(p.cls, p.subject)]; const chs = e ? toList(e.chapters) : [];
    if (!chs.length) { document.getElementById('tv2-st').innerText = 'Is kitab mein abhi chapters nahi hain.'; return; }
    const ch = chs.map(function(c) { return { ch: c.name || c.title || c.chapter || '', status: c.status || 'Pending' }; }).slice(0, 60);
    tv2Ask('Make a weekly lesson plan (Monday to Saturday) for ' + p.cls + ' ' + p.subject + ', book "' + ((e && e.bookName) || '') + '". Continue from pending chapters only; for each day give the topic plus one short activity or homework. Pakistani Roman Urdu, short, no asterisks.\nCHAPTERS: ' + JSON.stringify(ch));
}
function tv2Weak(kind) {
    const cls = S.mk.cls; const rows = tv2ClassRows(cls).slice(0, 45);
    if (!rows.length) { document.getElementById('tv2-st').innerText = 'Is class ke marks abhi nahi hain.'; return; }
    const head = kind === 'weak' ? 'List weak students (below 50 percent) of ' + cls + ' with their weak subjects and the extra practice each needs.' : 'Write a kind, constructive 2-sentence report card remark for each student of ' + cls + ' based only on the marks. Format: Name: remark.';
    tv2Ask(head + ' Pakistani Roman Urdu, short, no asterisks.\nDATA: ' + JSON.stringify(rows));
}

    const oS = renderSyllabus, oM = renderMarks;

    renderMarks = function() { oM(); try { if (S.classes.length && S.tests.length) document.getElementById('tab-marks').insertAdjacentHTML('beforeend', tv2Card('AI Helper (selected class)', tv2Btn('🔻 Weak Students', "tv2Weak('weak')") + tv2Btn('📝 Remarks Draft', "tv2Weak('remarks')"))); } catch (e) { console.warn(e); } };
})();
